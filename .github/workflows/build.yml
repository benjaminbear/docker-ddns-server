---
name: 'build go project'

on:
  pull_request:
  push:
    branches: ["**"]

jobs:
  build:

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.27'

      - name: Build
        run: |
          cd dyndns
          go build -v ./...

      - name: Test
        run: |
          cd dyndns
          go test -v ./...
